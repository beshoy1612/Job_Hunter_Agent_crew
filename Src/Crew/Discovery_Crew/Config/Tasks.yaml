Profile_Analyst_Task:
  description: >
    Analyze the candidate's professional profile using the provided CV,
    GitHub profile, and LinkedIn profile.

    First, review the candidate's CV to identify their education,
    professional experience, technical skills, projects,
    certifications, and other relevant qualifications.

    Then, use the provided GitHub profile URL to retrieve and analyze
    the candidate's public repositories, programming languages,
    technologies, projects, and other relevant technical evidence.

    Finally, use the provided LinkedIn profile URL to retrieve and
    analyze relevant professional information such as experience,
    job titles, skills, education, certifications, and career history.

    Cross-reference the information from all available sources.
    Identify consistent information, additional skills or experience,
    and any discrepancies between the sources.

    Based on the complete analysis, build a comprehensive candidate
    profile that can be used by the next agent to generate relevant
    job search keywords and queries.

    Candidate CV:
    {cv}

    GitHub Profile:
    {github_link}

    LinkedIn Profile:
    {linkedin_link}
  expected_output: >
    A structured candidate profile containing:
    - Professional summary
    - Technical skills
    - Programming languages
    - Frameworks and technologies
    - Professional experience
    - Education
    - Projects
    - Certifications
    - GitHub-based technical evidence
    - LinkedIn-based professional evidence
    - Career interests
    - Suitable job roles
    - Experience level
    - Preferred location if available
    - Identified skill gaps
    - Key strengths

    The output must clearly distinguish between information directly
    provided by the candidate and information supported by GitHub or
    LinkedIn evidence.
  
  agent: Profile_Analyst_Agent

Keyword_Strategist_Task:
  description: >
    Analyze the candidate profile produced by the Profile Analyst Agent
    and transform it into a focused set of high-quality job-search queries.

    Determine the most relevant job roles and technical keywords based
    on the candidate's experience level, career interests, professional
    experience, projects, demonstrated skills, technologies,
    certifications, and verified GitHub evidence.

    Use realistic job-title variations and relevant technical keywords
    to create targeted search queries that can be used directly by the
    Job Researcher Agent.

    Prioritize the candidate's strongest and most relevant skills rather
    than including every technology mentioned in the profile.

    The queries should balance precision and search coverage. Include
    different combinations of relevant job titles, technical skills,
    specialization areas, and experience-level terms where appropriate.

    Avoid combining unrelated technologies simply because they appear
    in the candidate profile.

    Respect the candidate's actual experience level. Do not introduce
    senior, lead, staff, principal, architect, or other advanced roles
    unless they are clearly supported by the profile.

    Do not invent skills, technologies, certifications, experience,
    job roles, or qualifications that are not supported by the profile.

    If any professional source is explicitly marked as unreliable or
    unrelated, ignore that source when generating search queries.

    Consider the candidate's preferred locations when appropriate.
    Generate both location-specific and location-independent queries
    when this improves search coverage.

    Generate concise, realistic queries that resemble searches a
    candidate or recruiter would use on job-search platforms.

    Do not search for or retrieve actual job listings. Your responsibility
    is only to generate the search queries that will be passed to the
    Job Researcher Agent.

  expected_output: >
    A structured JSON object containing a list of optimized job-search
    queries.

    Each query must represent a meaningful combination of a relevant
    job title and, when useful, one or more relevant technical skills,
    specialization terms, experience-level terms, or location terms.

    The queries must be diverse enough to cover the candidate's strongest
    job opportunities while remaining focused and relevant.

    Do not include explanations, job listings, company names, or
    additional candidate information.

  agent: Keyword_Strategist_Agent
  

Job_Search_Task:

  description: >
    Discover relevant and recent job opportunities using the search
    queries generated by the Keyword Strategist Agent.

    User-provided websites:
    {websites}

    Maximum allowed job age in days:
    {max_job_age_days}

    Use the search queries generated by the Keyword Strategist Agent.

    Search only within the websites specified in {websites} and only jobs in Egypt or remote.

    Use Job_Search_Tool to search for job opportunities using Tavily.

    Prioritize job opportunities published within the last
    {max_job_age_days} days whenever possible.

    Use search parameters that prioritize recent results whenever
    supported by the search tool.

    Return all potentially relevant discovered job listings .

    For every discovered result, preserve:

    - title
    - url
    - content
    - source

    Do not scrape job pages.

    Do not extract detailed job information.

    Do not calculate relevance scores.

    Do not evaluate candidate compatibility.

    Do not make final job eligibility decisions.

    Do not invent information.

  expected_output: >
    A structured JSON object containing discovered job listings.
    Each job must include its title, URL, content snippet,
    and source website.

  agent: Job_Search_Agent
  

Job_Scraper_Task:
  description: >
    Receive the job listings discovered by the Job Search Agent.

    User-provided maximum job age:
    {max_job_age_days}

    Use scrape_job_Tool to extract structured and verifiable
    information from every discovered job listing page.

    Extract:

    - title
    - company
    - location
    - work_mode
    - posted_date
    - job_status
    - description
    - requirements
    - technologies
    - experience_level
    - application_url

    The posted_date is mandatory for determining job freshness.

    Verify that posted_date represents the original job publication date.

    Do not use the search date, scrape date, website indexing date,
    or page update date as the posting date unless the source
    explicitly identifies it as the original job posting date.

    If the original posting date cannot be verified, return null.

    The allowed job age is {max_job_age_days} days.

    Jobs older than {max_job_age_days} days are not eligible
    for the final result.

    Reject clearly expired, closed, filled, or inactive jobs when
    the source explicitly indicates their status.

    Do not search for additional jobs.

    Do not calculate relevance scores.

    Do not evaluate candidate compatibility.

    Do not make final eligibility decisions.

    Do not invent information.

    Return the extracted information in the required structured format.

  expected_output: >
    A structured JSON object containing detailed and verified
    information extracted from the discovered job listing pages.

  agent: Job_Scraper_Agent

 